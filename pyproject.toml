[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grokbot"
version = "0.2.0"
description = "Local tool-using coding/chat agent (web UI + CLI) for any OpenAI-compatible provider"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "requests",
  "flask",
  "pypdf>=6.0,<7",
  "defusedxml>=0.7,<1",
]

[project.scripts]
grokbot = "grokbot.cli:main"

[tool.setuptools]
packages = ["grokbot", "grokbot.tools"]
py-modules = ["webui", "agent_loop", "task_harness", "skills", "documents", "model_discovery", "bot"]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["templates/*.html", "static/*.css", "static/*.js", "static/vendor/*"]
