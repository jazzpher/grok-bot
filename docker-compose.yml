services:
  grokbot:
    build: .
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      GROK_API_KEY: ${GROK_API_KEY:-}
      GROK_API_URL: ${GROK_API_URL:-https://generativelanguage.googleapis.com/v1beta/openai/chat/completions}
      GROK_MODEL: ${GROK_MODEL:-gemini-flash-latest}
      GROK_APP_PASSWORD: ${GROK_APP_PASSWORD:?set GROK_APP_PASSWORD - the container is reached through the Docker bridge, so login is mandatory}
      GROK_DEPLOYMENT_MODE: exposed
      GROK_SESSION_SECRET: ${GROK_SESSION_SECRET:-}
      GROK_SEARCH_BACKEND: ${GROK_SEARCH_BACKEND:-auto}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
    volumes:
      - grokbot-data:/data
    # Keep the container itself contained: the agent runs shell commands inside it.
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 256
    mem_limit: 1g
volumes:
  grokbot-data:
